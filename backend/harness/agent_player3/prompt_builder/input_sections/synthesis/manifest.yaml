version: 2
phase: synthesis

messages:
  - role: system
    sections:
      - id: tool_schemas
        template: system/tool_schemas.md
      - id: phase_instructions
        template: system/phase_instructions.md

  - role: user
    sections:
      - id: canonical_board_state
        template: user/board_state.md
        provider: board_state
        with:
          source: canonical
          include_scratch_moves: false

      - id: scratch_board_state
        template: user/board_state.md
        provider: board_state
        when:
          field: scratch.status
          equals: active
        with:
          source: scratch
          include_scratch_moves: true

      - id: running_thoughts
        template: user/running_thoughts.md
        provider: running_thoughts

      - id: tested_lines
        template: user/tested_lines.md
        provider: tested_lines

      - id: forced_tool_retry
        template: user/forced_tool_retry.md
        provider: forced_tool_retry
        when:
          field: retry.active
          equals: true
