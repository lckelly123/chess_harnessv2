    THESIS: One move, its board position, and its causal trace read as one arbiter's record; refuse the detached board-plus-generic-dashboard pattern.
    OWN-WORLD: Vellum sheets, graphite rules, tournament green fields, rust stop marks, square ledger cells, and compact tabular annotations.
    STORY: Choose two versioned harnesses, observe the backend-authored match, inspect why each move happened, then find and replay its record.
    FIRST VIEWPORT: A slim match docket spans the top; below it a large board owns the left two-thirds while the active phase and chronological trace form a ruled ledger at right. Start sits in the docket; stop sits beside live status.
    FORM: Tournament arbiter's match ledger, grounded direction 5, seed 37c9b6b8. Signature interaction: the replay cursor aligns board, notation, and trace with one registration mark.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
