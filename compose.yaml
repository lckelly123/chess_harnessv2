services:
  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "8000:8000"
    environment:
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      LMSTUDIO_MODEL: ${LMSTUDIO_MODEL:-}
      LMSTUDIO_API_KEY: ${LMSTUDIO_API_KEY:-lm-studio}
      LMSTUDIO_REASONING_EFFORT: ${LMSTUDIO_REASONING_EFFORT:-medium}
      LMSTUDIO_RETRY_REASONING_EFFORT: ${LMSTUDIO_RETRY_REASONING_EFFORT:-none}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-chess-harness-v2-dev}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_WORKSPACE_ID: ${LANGSMITH_WORKSPACE_ID:-}
      MATCH_DATABASE_PATH: ${MATCH_DATABASE_PATH:-/app/data/chess-harness.sqlite3}
      MATCH_MAX_ACTIVE: ${MATCH_MAX_ACTIVE:-1}
    volumes:
      - ./backend/app:/app/app
      - ./backend/chess_core:/app/chess_core
      - ./backend/harness:/app/harness
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 2s
      retries: 10

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
  backend_data:
