services:
  positions_db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSITIONS_DB_NAME:-chess_positions}
      POSTGRES_USER: ${POSITIONS_DB_USER:-chess}
      POSTGRES_PASSWORD: ${POSITIONS_DB_PASSWORD:-chess_local}
    ports:
      - "127.0.0.1:${POSITIONS_DB_PORT:-5433}:5432"
    volumes:
      - positions_data:/var/lib/postgresql/data
      - ./backend/positional_testing/datasets/schema.sql:/docker-entrypoint-initdb.d/001-positions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "8000:8000"
    environment:
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      LMSTUDIO_MODEL: ${LMSTUDIO_MODEL:-}
      LMSTUDIO_API_KEY: ${LMSTUDIO_API_KEY:-lm-studio}
      LMSTUDIO_REASONING_EFFORT: ${LMSTUDIO_REASONING_EFFORT:-medium}
      LMSTUDIO_RETRY_REASONING_EFFORT: ${LMSTUDIO_RETRY_REASONING_EFFORT:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-8000}
      OPENAI_RETRY_MAX_OUTPUT_TOKENS: ${OPENAI_RETRY_MAX_OUTPUT_TOKENS:-2000}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-chess-harness-v2-dev}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_WORKSPACE_ID: ${LANGSMITH_WORKSPACE_ID:-}
      MATCH_DATABASE_PATH: ${MATCH_DATABASE_PATH:-/app/data/chess-harness.sqlite3}
      MATCH_MAX_ACTIVE: ${MATCH_MAX_ACTIVE:-1}
      POSITIONS_DB_HOST: positions_db
      POSITIONS_DB_PORT: 5432
      POSITIONS_DB_NAME: ${POSITIONS_DB_NAME:-chess_positions}
      POSITIONS_DB_USER: ${POSITIONS_DB_USER:-chess}
      POSITIONS_DB_PASSWORD: ${POSITIONS_DB_PASSWORD:-chess_local}
      POSITION_EVAL_NODES_PER_MOVE: ${POSITION_EVAL_NODES_PER_MOVE:-500000}
      POSITION_EVAL_HASH_MB: ${POSITION_EVAL_HASH_MB:-128}
      POSITION_EVAL_TIMEOUT_SECONDS: ${POSITION_EVAL_TIMEOUT_SECONDS:-180}
      POSITION_QUEUE_ITEM_TIMEOUT_SECONDS: ${POSITION_QUEUE_ITEM_TIMEOUT_SECONDS:-1800}
    volumes:
      - ./backend/app:/app/app
      - ./backend/chess_core:/app/chess_core
      - ./backend/harness:/app/harness
      - ./backend/positional_testing:/app/positional_testing
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 2s
      retries: 10

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
  backend_data:
  positions_data:
